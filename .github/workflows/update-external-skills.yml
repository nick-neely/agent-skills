name: Update external skills

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-external-skills

jobs:
  propose:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check upstream skill and license revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-external-skills.mjs
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/external-skill-updates
          delete-branch: true
          add-paths: external-skills.json
          commit-message: 'chore: update external workflow skills'
          title: 'Update external workflow skills'
          body: 'Updates upstream skill or license revisions used by the workflow installer. Review upstream changes and the install checks before merging.'
